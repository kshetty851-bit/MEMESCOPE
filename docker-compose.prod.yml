# Production overlay:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Differences from local: production build targets, no source bind mounts, no
# published database/cache ports, resource limits, and Caddy in front.

name: memescope

services:
  postgres:
    restart: unless-stopped
    # `!reset []` — NOT `ports: []`.
    #
    # Compose merges list-valued fields by concatenation, so an empty list
    # removes nothing: the base file's mapping survived into the production
    # config and published Postgres and Redis on the host. On a public server
    # with a permissive firewall that is the database exposed to the internet.
    # Caught by the Phase 6C production rehearsal, which is the only reason it
    # was not found by someone else first. `!reset` is the documented way to
    # clear an inherited value (Compose spec 2.24+).
    ports: !reset []
    volumes:
      - postgres-data:/var/lib/postgresql/data
    deploy:
      resources:
        limits: { cpus: "2", memory: 2G }

  redis:
    restart: unless-stopped
    ports: !reset []
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required in production}
    command: >
      redis-server
      --appendonly yes
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required in production}
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits: { cpus: "1", memory: 768M }

  backend:
    build:
      context: ./backend
      target: production
    command:
      - /bin/bash
      - ./scripts/entrypoint.sh
      - gunicorn
      - app.main:app
      - --worker-class=uvicorn.workers.UvicornWorker
      - --workers=4
      - --bind=0.0.0.0:8000
      - --access-logfile=-
      - --error-logfile=-
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      LOG_FORMAT: json
      REFRESH_COOKIE_SECURE: "true"
      # Migrations are owned by deploy.sh, which runs them once as an ordered
      # step before any container starts. Left on, every replica races to apply
      # them at boot and they collide creating `alembic_version` — harmless the
      # first time, but a real migration racing itself is how a schema ends up
      # half-applied with one replica dead.
      RUN_MIGRATIONS: "false"
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:?ALLOWED_HOSTS must be explicit in production}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS must be explicit in production}
      ALPHA_ACCESS_CODE: ${ALPHA_ACCESS_CODE:?ALPHA_ACCESS_CODE is required in production}
      ALPHA_ACCESS_REQUIRED: "true"
      ALPHA_ACCESS_COOKIE_SECURE: "true"
      # Without this the rate limiter keys every user onto Caddy's address and
      # they share one allowance. Compose gives services a private network, so
      # the whole bridge subnet is the trust boundary.
      TRUSTED_PROXY_IPS: ${TRUSTED_PROXY_IPS:-172.16.0.0/12}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.1}
      BUILD_SHA: ${BUILD_SHA:-unknown}
    volumes: !reset []
    # Unpublished on purpose: Caddy reaches the backend over the compose
    # network. Publishing a fixed host port is also incompatible with more than
    # one replica — the second container cannot bind an address the first holds,
    # which is exactly how this was discovered.
    ports: !reset []
    restart: unless-stopped
    deploy:
      replicas: 2
      resources:
        limits: { cpus: "2", memory: 1G }

  worker:
    build:
      context: ./backend
      target: production
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=4
    environment:
      ENVIRONMENT: production
      LOG_FORMAT: json
      RUN_MIGRATIONS: "false"
      ALPHA_ACCESS_CODE: ${ALPHA_ACCESS_CODE:?ALPHA_ACCESS_CODE is required in production}
      ALPHA_ACCESS_REQUIRED: "true"
      ALPHA_ACCESS_COOKIE_SECURE: "true"
      SENTRY_DSN: ${SENTRY_DSN:-}
      BUILD_SHA: ${BUILD_SHA:-unknown}
    volumes: !reset []
    restart: unless-stopped
    healthcheck:
      # The image's HEALTHCHECK curls the API's /live, which does not exist in
      # this container — so it always failed and the status meant nothing while
      # a wedged worker consumed nothing for fifty minutes on 2026-08-21.
      test: ["CMD", "python", "-m", "app.health.worker_probe", "worker"]
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 60s

  scheduler:
    build:
      context: ./backend
      target: production
    # `--schedule` must point somewhere the unprivileged user can write.
    command: >
      celery -A app.workers.celery_app beat --loglevel=info
      --schedule=/var/lib/celery/celerybeat-schedule
    environment:
      ENVIRONMENT: production
      LOG_FORMAT: json
      RUN_MIGRATIONS: "false"
      ALPHA_ACCESS_CODE: ${ALPHA_ACCESS_CODE:?ALPHA_ACCESS_CODE is required in production}
      ALPHA_ACCESS_REQUIRED: "true"
      ALPHA_ACCESS_COOKIE_SECURE: "true"
      SENTRY_DSN: ${SENTRY_DSN:-}
      BUILD_SHA: ${BUILD_SHA:-unknown}
    volumes: !reset
      - celery-beat:/var/lib/celery
    restart: unless-stopped
    healthcheck:
      # Beat only sends, so it cannot answer a ping. Its shelve is the signal:
      # it is rewritten on every tick, so a file that stops advancing is a
      # scheduler that has stopped scheduling.
      test: ["CMD", "python", "-m", "app.health.worker_probe", "beat"]
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 90s

  # A disabled feature exits 0 and must then stay stopped. Under
  # `unless-stopped` a clean exit is restarted forever, which burns CPU and
  # fills the logs with a loop that looks like a crash. `on-failure` restarts a
  # genuine crash and respects a deliberate no-op.
  scanner:
    build:
      context: ./backend
      target: production
    environment:
      ENVIRONMENT: production
      LOG_FORMAT: json
      RUN_MIGRATIONS: "false"
      ALPHA_ACCESS_CODE: ${ALPHA_ACCESS_CODE:?ALPHA_ACCESS_CODE is required in production}
      ALPHA_ACCESS_REQUIRED: "true"
      ALPHA_ACCESS_COOKIE_SECURE: "true"
      SENTRY_DSN: ${SENTRY_DSN:-}
      BUILD_SHA: ${BUILD_SHA:-unknown}
    volumes: !reset []
    restart: on-failure
    deploy:
      resources:
        limits: { cpus: "1", memory: 768M }

  enrichment:
    build:
      context: ./backend
      target: production
    environment:
      ENVIRONMENT: production
      LOG_FORMAT: json
      RUN_MIGRATIONS: "false"
      ALPHA_ACCESS_CODE: ${ALPHA_ACCESS_CODE:?ALPHA_ACCESS_CODE is required in production}
      ALPHA_ACCESS_REQUIRED: "true"
      ALPHA_ACCESS_COOKIE_SECURE: "true"
      SENTRY_DSN: ${SENTRY_DSN:-}
      BUILD_SHA: ${BUILD_SHA:-unknown}
    volumes: !reset []
    restart: on-failure
    deploy:
      resources:
        limits: { cpus: "1", memory: 768M }
      # Two replicas, not one. `claim_due` takes its batch with
      # `FOR UPDATE SKIP LOCKED` precisely so replicas claim disjoint sets, and
      # the cycle is dominated by per-batch work after the provider call — so
      # throughput scales by running more cycles at once, not by widening one.
      #
      # Measured on production 2026-08-21, matured 30-minute cohorts: nursery
      # claims rose 335 -> 502/min, tokens reaching the Radar's
      # 12-observation floor went 10.2% -> 84.4%, and every token with a real
      # market (liquidity >= $1k) reached it — 13.6% -> 100%. Median time to
      # twelve observations fell from 23.8 to 18.0 minutes, inside the
      # 30-minute nursery window it has to fit in.
      #
      # Deliberately two and not more: provider load is 44 req/min against a
      # 300/min allowance, and open-position p95 refresh stayed at 71s. There
      # is headroom, and no reason to spend it.
      replicas: 2

  frontend:
    build:
      context: ./frontend
      target: production
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?required}
        NEXT_PUBLIC_ENVIRONMENT: production
        NEXT_PUBLIC_BUILD_SHA: ${BUILD_SHA:-unknown}
        NEXT_PUBLIC_ALPHA: "true"
        NEXT_PUBLIC_POSTHOG_KEY: ${POSTHOG_KEY:-}
        NEXT_PUBLIC_POSTHOG_HOST: ${POSTHOG_HOST:-https://eu.i.posthog.com}
        NEXT_PUBLIC_FEEDBACK_URL: ${FEEDBACK_URL:-}
    volumes: !reset []
    ports: !reset []
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: "1", memory: 512M }

  # Supersedes the nginx service. See docker/caddy/Caddyfile for why: nginx
  # needed certificates to already exist and had no renewal path, which is not
  # a permanent HTTPS URL. docker/nginx/nginx.conf is retained but unused.
  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN is required — Caddy needs it to request a certificate}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL is required for Let's Encrypt expiry notices}
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates and ACME account keys. Losing this volume means
      # re-requesting every certificate, which Let's Encrypt rate-limits to
      # five per week per domain — enough to lock out a bad afternoon.
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "caddy", "version"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Uses the Postgres image rather than the backend one: `pg_dump` must match
  # the server's major version, and pinning both to the same image makes that
  # true by construction instead of by remembering. It also keeps the backend
  # image free of a client it never uses.
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/scripts/backup-loop.sh"]
    volumes:
      - ./scripts:/scripts:ro
      - backup-data:/backups
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-memescope}
      PGPASSWORD: ${POSTGRES_PASSWORD:?required}
      PGDATABASE: ${POSTGRES_DB:-memescope}
      BACKUP_DIR: /backups
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  celery-beat:
  postgres-data:
  redis-data:
  caddy-data:
  caddy-config:
  backup-data:
