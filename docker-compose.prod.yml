# Production overlay:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Differences from local: production build targets, no source bind mounts, no
# published database/cache ports, resource limits, and nginx in front.

name: memescope

services:
  postgres:
    ports: []
    volumes:
      - postgres-data:/var/lib/postgresql/data
    deploy:
      resources:
        limits: { cpus: "2", memory: 2G }

  redis:
    ports: []
    command: >
      redis-server
      --appendonly yes
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required in production}
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    deploy:
      resources:
        limits: { cpus: "1", memory: 768M }

  backend:
    build:
      context: ./backend
      target: production
    command:
      - /bin/bash
      - ./scripts/entrypoint.sh
      - gunicorn
      - app.main:app
      - --worker-class=uvicorn.workers.UvicornWorker
      - --workers=4
      - --bind=0.0.0.0:8000
      - --access-logfile=-
      - --error-logfile=-
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      LOG_FORMAT: json
      REFRESH_COOKIE_SECURE: "true"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:?ALLOWED_HOSTS must be explicit in production}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS must be explicit in production}
    volumes: []
    ports: []
    deploy:
      replicas: 2
      resources:
        limits: { cpus: "2", memory: 1G }

  worker:
    build:
      context: ./backend
      target: production
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=4
    environment:
      ENVIRONMENT: production
      LOG_FORMAT: json
      RUN_MIGRATIONS: "false"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes: []

  scheduler:
    build:
      context: ./backend
      target: production
    command: celery -A app.workers.celery_app beat --loglevel=info
    environment:
      ENVIRONMENT: production
      LOG_FORMAT: json
      RUN_MIGRATIONS: "false"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes: []

  frontend:
    build:
      context: ./frontend
      target: production
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?required}
        NEXT_PUBLIC_ENVIRONMENT: production
    volumes: []
    ports: []
    deploy:
      resources:
        limits: { cpus: "1", memory: 512M }

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - backend
      - frontend

volumes:
  postgres-data:
  redis-data:
