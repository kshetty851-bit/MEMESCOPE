[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "memescope-pretrade-ai"
version = "1.0.0"
description = "Read-only, leakage-aware pre-trade scoring and offline backtesting for MEMESCOPE"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "joblib==1.6.0",
  "numpy==1.26.4",
  "pandas==2.2.2",
  "pydantic==2.12.5",
  "PyYAML==6.0.3",
  "scikit-learn==1.5.1"
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[project.scripts]
memescope-score = "memescope_pretrade_ai.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
