# Local development stack.
# Production overrides live in docker-compose.prod.yml.

name: memescope

x-backend-env: &backend-env
  ENVIRONMENT: ${ENVIRONMENT:-local}
  DEBUG: ${DEBUG:-true}
  SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required — copy .env.example to .env}
  POSTGRES_HOST: postgres
  POSTGRES_PORT: 5432
  POSTGRES_USER: ${POSTGRES_USER:-memescope}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-memescope}
  POSTGRES_DB: ${POSTGRES_DB:-memescope}
  REDIS_HOST: redis
  REDIS_PORT: 6379
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  LOG_FORMAT: ${LOG_FORMAT:-console}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
  REFRESH_COOKIE_SECURE: ${REFRESH_COOKIE_SECURE:-false}
  HELIUS_API_KEY: ${HELIUS_API_KEY:-}
  FEATURE_SCANNER_ENABLED: ${FEATURE_SCANNER_ENABLED:-false}
  SCANNER_WATCH_PROGRAMS: ${SCANNER_WATCH_PROGRAMS:-6EF8rrecthR5Dkzon8Nwu78hRvfCKubJ14M5uBEwF6P}
  SCANNER_COMMITMENT: ${SCANNER_COMMITMENT:-confirmed}
  SCANNER_WORKER_CONCURRENCY: ${SCANNER_WORKER_CONCURRENCY:-4}
  FEATURE_ENRICHMENT_ENABLED: ${FEATURE_ENRICHMENT_ENABLED:-false}
  MARKET_PROVIDER: ${MARKET_PROVIDER:-dexscreener}
  MARKET_PROVIDER_BASE_URL: ${MARKET_PROVIDER_BASE_URL:-https://api.dexscreener.com}
  MARKET_PROVIDER_BATCH_SIZE: ${MARKET_PROVIDER_BATCH_SIZE:-30}
  ENRICHMENT_BATCH_LIMIT: ${ENRICHMENT_BATCH_LIMIT:-60}
  ENRICHMENT_POLL_INTERVAL_SECONDS: ${ENRICHMENT_POLL_INTERVAL_SECONDS:-5}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-memescope}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-memescope}
      POSTGRES_DB: ${POSTGRES_DB:-memescope}
      # Deterministic collation keeps index behaviour identical across machines.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-memescope} -d ${POSTGRES_DB:-memescope}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      target: development
    restart: unless-stopped
    command:
      - /bin/bash
      - ./scripts/entrypoint.sh
      - uvicorn
      - app.main:app
      - --host=0.0.0.0
      - --port=8000
      - --reload
    environment: *backend-env
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      # Bind-mount source for hot reload; keep the image's venv out of the way.
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/live"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  worker:
    build:
      context: ./backend
      target: development
    restart: unless-stopped
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=2
    environment:
      <<: *backend-env
      RUN_MIGRATIONS: "false"
    volumes:
      - ./backend:/app
    depends_on:
      backend:
        condition: service_healthy

  scheduler:
    build:
      context: ./backend
      target: development
    restart: unless-stopped
    command: celery -A app.workers.celery_app beat --loglevel=info
    environment:
      <<: *backend-env
      RUN_MIGRATIONS: "false"
    volumes:
      - ./backend:/app
    depends_on:
      backend:
        condition: service_healthy

  # Long-lived Helius WebSocket consumer. Deliberately a single replica: each
  # instance opens its own subscription, so scaling out would duplicate every
  # event rather than share the load.
  scanner:
    build:
      context: ./backend
      target: development
    restart: unless-stopped
    command: python -m app.scanner_main
    environment:
      <<: *backend-env
      RUN_MIGRATIONS: "false"
    volumes:
      - ./backend:/app
    depends_on:
      backend:
        condition: service_healthy

  # Market Enrichment Worker. Independent of the scanner: stopping this service
  # must never affect token discovery.
  enrichment:
    build:
      context: ./backend
      target: development
    restart: unless-stopped
    command: python -m app.enrichment_main
    environment:
      <<: *backend-env
      RUN_MIGRATIONS: "false"
    volumes:
      - ./backend:/app
    depends_on:
      backend:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      target: development
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-MemeScope AI}
      NEXT_PUBLIC_ENVIRONMENT: ${NEXT_PUBLIC_ENVIRONMENT:-local}
      WATCHPACK_POLLING: "true"
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ./frontend:/app
      # Anonymous volumes so container-built artifacts are not shadowed by the host.
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend

volumes:
  postgres-data:
  redis-data:
