# Local development stack.
# Production overrides live in docker-compose.prod.yml.

name: memescope

x-backend-env: &backend-env
  ENVIRONMENT: ${ENVIRONMENT:-local}
  DEBUG: ${DEBUG:-true}
  SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required — copy .env.example to .env}
  POSTGRES_HOST: postgres
  POSTGRES_PORT: 5432
  POSTGRES_USER: ${POSTGRES_USER:-memescope}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-memescope}
  POSTGRES_DB: ${POSTGRES_DB:-memescope}
  REDIS_HOST: redis
  REDIS_PORT: 6379
  # In the anchor, not per-service. Production starts Redis with `--requirepass`,
  # so a container that does not receive this fails every Redis call with NOAUTH.
  # It was previously set on backend/worker/scheduler only, which left `scanner`
  # unable to publish discoveries and `enrichment` unable to subscribe to them —
  # the live pipeline, broken in production and working in development. Third
  # occurrence of the trap this anchor's comment below describes.
  REDIS_PASSWORD: ${REDIS_PASSWORD:-}
  LIVE_EVENT_CHANNEL: ${LIVE_EVENT_CHANNEL:-memescope:live:changed}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  LOG_FORMAT: ${LOG_FORMAT:-console}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USERNAME: ${SMTP_USERNAME:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
  SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
  SMTP_FROM_NAME: ${SMTP_FROM_NAME:-}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
  # In the anchor because a password-reset link is built from it. It was set in
  # .env.production and absent here, so the container fell back to the code
  # default and every reset link would have pointed at http://localhost:3000 —
  # the same trap this anchor's comment above describes, now for the fifth time.
  FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
  # Every setting the production validators demand must live in this anchor, not
  # on one service. `ENVIRONMENT` reaches all of these containers from here, so
  # anything production then *requires* has to arrive with it — otherwise the
  # workers boot into production mode without the values that mode insists on
  # and restart-loop, while the backend (which had them set individually) looks
  # perfectly healthy. That is exactly what happened with ALLOWED_HOSTS.
  ALLOWED_HOSTS: ${ALLOWED_HOSTS:-*}
  TRUSTED_PROXY_IPS: ${TRUSTED_PROXY_IPS:-}
  REFRESH_COOKIE_SECURE: ${REFRESH_COOKIE_SECURE:-false}
  ALPHA_ACCESS_CODE: ${ALPHA_ACCESS_CODE:-619554}
  ALPHA_ACCESS_REQUIRED: ${ALPHA_ACCESS_REQUIRED:-false}
  ALPHA_ACCESS_COOKIE_SECURE: ${ALPHA_ACCESS_COOKIE_SECURE:-false}
  ALPHA_ACCESS_COOKIE_SAMESITE: ${ALPHA_ACCESS_COOKIE_SAMESITE:-lax}
  ALPHA_ACCESS_SESSION_DAYS: ${ALPHA_ACCESS_SESSION_DAYS:-30}
  SENTRY_DSN: ${SENTRY_DSN:-}
  SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.1}
  BUILD_SHA: ${BUILD_SHA:-unknown}
  # Which RPC implementation every service talks to. In the anchor, not on the
  # scanner: the scanner subscribes and the enrichment worker reads accounts,
  # and a value set on one service only would point the two at different nodes.
  # `solana` is plain JSON-RPC and needs no key.
  SOLANA_RPC_PROVIDER: ${SOLANA_RPC_PROVIDER:-helius}
  # Chainstack: primary standard-RPC endpoint once configured (URL embeds the
  # token; never printed). The router (provider "auto") reads it everywhere.
  CHAINSTACK_RPC_URL: ${CHAINSTACK_RPC_URL:-}
  SOLANA_RPC_URL: ${SOLANA_RPC_URL:-https://api.mainnet-beta.solana.com}
  SOLANA_WS_URL: ${SOLANA_WS_URL:-wss://api.mainnet-beta.solana.com}
  HELIUS_API_KEY: ${HELIUS_API_KEY:-}
  FEATURE_SCANNER_ENABLED: ${FEATURE_SCANNER_ENABLED:-false}
  # pump.fun bonding-curve launches plus direct PumpSwap pool launches. The
  # pAMM program's create_pool emits a CreatePoolEvent naming the base mint —
  # verified on mainnet; see app/services/scanner/parser.py.
  SCANNER_WATCH_PROGRAMS: ${SCANNER_WATCH_PROGRAMS:-6EF8rrecthR5Dkzon8Nwu78hRvfCKubJ14M5uBEwF6P,pAMMBay6oceH9fJKBRHGP5D4bD4sWpmSwMn52FMfXEA}
  # Gap recovery on (re)connect: the slot budget the scanner may walk back with
  # getBlock, and the pause between block reads. Zero slots disables recovery.
  SCANNER_RECOVERY_MAX_SLOTS: ${SCANNER_RECOVERY_MAX_SLOTS:-900}
  SCANNER_RECOVERY_BLOCK_DELAY_SECONDS: ${SCANNER_RECOVERY_BLOCK_DELAY_SECONDS:-1.0}
  SCANNER_COMMITMENT: ${SCANNER_COMMITMENT:-confirmed}
  SCANNER_WORKER_CONCURRENCY: ${SCANNER_WORKER_CONCURRENCY:-4}
  # Reconnect escalation and the state the scanner publishes for the health
  # endpoint. In the anchor, not on the scanner service: the scanner writes the
  # state and the API reads it, so both containers must agree on the TTL and on
  # what counts as "failing".
  SCANNER_RECONNECT_ERROR_ATTEMPTS: ${SCANNER_RECONNECT_ERROR_ATTEMPTS:-5}
  SCANNER_RECONNECT_ERROR_EVERY: ${SCANNER_RECONNECT_ERROR_EVERY:-20}
  SCANNER_STATE_TTL_SECONDS: ${SCANNER_STATE_TTL_SECONDS:-300}
  # Yellowstone is an isolated, non-authoritative shadow stream. Keeping the
  # flag off is mandatory until an operator supplies a provider endpoint/token.
  YELLOWSTONE_ENABLED: ${YELLOWSTONE_ENABLED:-false}
  YELLOWSTONE_SHADOW_MODE: ${YELLOWSTONE_SHADOW_MODE:-true}
  YELLOWSTONE_GRPC_URL: ${YELLOWSTONE_GRPC_URL:-}
  YELLOWSTONE_X_TOKEN: ${YELLOWSTONE_X_TOKEN:-}
  YELLOWSTONE_PROGRAM_IDS: ${YELLOWSTONE_PROGRAM_IDS:-6EF8rrecthR5Dkzon8Nwu78hRvfCKubJ14M5uBEwF6P}
  YELLOWSTONE_REPLAY_OVERLAP_SLOTS: ${YELLOWSTONE_REPLAY_OVERLAP_SLOTS:-2}
  YELLOWSTONE_MAX_RECEIVE_BYTES: ${YELLOWSTONE_MAX_RECEIVE_BYTES:-16777216}
  # Pipeline health thresholds. Read by the API (the endpoint) and by the
  # scanner (its container healthcheck), so a value set on one service only
  # would let the two disagree about whether discovery is down.
  HEALTH_SCANNER_DEGRADED_MINUTES: ${HEALTH_SCANNER_DEGRADED_MINUTES:-15}
  HEALTH_SCANNER_DOWN_MINUTES: ${HEALTH_SCANNER_DOWN_MINUTES:-60}
  HEALTH_ENRICHMENT_DEGRADED_MINUTES: ${HEALTH_ENRICHMENT_DEGRADED_MINUTES:-10}
  HEALTH_ENRICHMENT_DOWN_MINUTES: ${HEALTH_ENRICHMENT_DOWN_MINUTES:-30}
  HEALTH_SCORING_DEGRADED_MINUTES: ${HEALTH_SCORING_DEGRADED_MINUTES:-30}
  HEALTH_SCORING_DOWN_MINUTES: ${HEALTH_SCORING_DOWN_MINUTES:-120}
  HEALTH_RADAR_DEGRADED_MINUTES: ${HEALTH_RADAR_DEGRADED_MINUTES:-30}
  HEALTH_RADAR_DOWN_MINUTES: ${HEALTH_RADAR_DOWN_MINUTES:-120}
  FEATURE_ENRICHMENT_ENABLED: ${FEATURE_ENRICHMENT_ENABLED:-false}
  MARKET_PROVIDER: ${MARKET_PROVIDER:-dexscreener}
  MARKET_PROVIDER_BASE_URL: ${MARKET_PROVIDER_BASE_URL:-https://api.dexscreener.com}
  MARKET_PROVIDER_BATCH_SIZE: ${MARKET_PROVIDER_BATCH_SIZE:-30}
  # Secondary liquidity fill, used only when MARKET_PROVIDER=composite. In the
  # anchor for the same reason as FEATURE_RADAR_ENABLED above: the enrichment
  # worker constructs the provider, but a setting absent from here silently
  # falls back to its code default whatever .env says.
  MARKET_SECONDARY_BASE_URL: ${MARKET_SECONDARY_BASE_URL:-https://api.geckoterminal.com/api/v2}
  MARKET_SECONDARY_NETWORK: ${MARKET_SECONDARY_NETWORK:-solana}
  MARKET_SECONDARY_BATCH_SIZE: ${MARKET_SECONDARY_BATCH_SIZE:-30}
  MARKET_SECONDARY_CALLS_PER_MINUTE: ${MARKET_SECONDARY_CALLS_PER_MINUTE:-25}
  # 120, up from 60: the worker was saturated at ~1,050 claims/min while lane
  # demand (display + nursery) alone needs ~800. The provider batches 30 mints
  # per request, so this is 4 requests per cycle against a 300/min allowance.
  ENRICHMENT_BATCH_LIMIT: ${ENRICHMENT_BATCH_LIMIT:-120}
  ENRICHMENT_POLL_INTERVAL_SECONDS: ${ENRICHMENT_POLL_INTERVAL_SECONDS:-5}
  # How many provider requests a cycle may have in flight. It has to rise with
  # ENRICHMENT_BATCH_LIMIT to do anything: a cycle splits into
  # ceil(batch / MARKET_PROVIDER_BATCH_SIZE) chunks, so at batch 120 there are
  # exactly four and a semaphore of four is never the binding constraint.
  # Absent from this anchor until 2026-08-21, which meant the setting existed
  # in config.py and could not be changed by anything — the fourth occurrence
  # of the trap this anchor exists to prevent.
  ENRICHMENT_CONCURRENCY: ${ENRICHMENT_CONCURRENCY:-4}
  # The fresh-token nursery lane. In the anchor, not on one service: the
  # scheduler's beat maintains membership and the enrichment worker honours it,
  # and a value set on one only would let the two disagree about the lane's
  # size. Capacity 0 disables the lane.
  ENRICHMENT_NURSERY_MAX_TOKENS: ${ENRICHMENT_NURSERY_MAX_TOKENS:-1000}
  ENRICHMENT_NURSERY_INTERVAL_SECONDS: ${ENRICHMENT_NURSERY_INTERVAL_SECONDS:-60}
  # Dead-letter policy. In the anchor because two services read it: the
  # enrichment worker decides when to park a token and the scheduler runs the
  # readmission beat, and a threshold set on one only would let them disagree
  # about what "parked" means. Both conditions must hold before a token is
  # parked — a count alone is cadence-dependent, and on 2026-08-05 a 60-second
  # provider outage parked 163 of the 200 priority-lane tokens.
  ENRICHMENT_DEAD_LETTER_THRESHOLD: ${ENRICHMENT_DEAD_LETTER_THRESHOLD:-10}
  ENRICHMENT_DEAD_LETTER_MIN_MINUTES: ${ENRICHMENT_DEAD_LETTER_MIN_MINUTES:-30}
  ENRICHMENT_DEAD_LETTER_RETRY_MINUTES: ${ENRICHMENT_DEAD_LETTER_RETRY_MINUTES:-60}
  ENRICHMENT_DEAD_LETTER_REQUEUE_LIMIT: ${ENRICHMENT_DEAD_LETTER_REQUEUE_LIMIT:-250}
  ENRICHMENT_DEFER_MIN_SECONDS: ${ENRICHMENT_DEFER_MIN_SECONDS:-15}
  FEATURE_AI_SCORING_ENABLED: ${FEATURE_AI_SCORING_ENABLED:-false}
  # The Opportunity Radar. In the anchor, not on one service: the API reads it
  # to report whether the Radar is running and the beat worker needs it to
  # decide whether to sweep. A flag on a single service is how this went wrong
  # twice before.
  FEATURE_RADAR_ENABLED: ${FEATURE_RADAR_ENABLED:-false}
  RADAR_SWEEP_BATCH_LIMIT: ${RADAR_SWEEP_BATCH_LIMIT:-500}
  # Append-only research capture. It observes a committed Radar result and
  # never alters a score, rank, scanner decision, or wallet action.
  FEATURE_RADAR_QUALITY_DATASET: ${FEATURE_RADAR_QUALITY_DATASET:-true}
  RADAR_QUALITY_CONTROL_SAMPLE_MODULUS: ${RADAR_QUALITY_CONTROL_SAMPLE_MODULUS:-20}
  RADAR_QUALITY_OUTCOME_BATCH_LIMIT: ${RADAR_QUALITY_OUTCOME_BATCH_LIMIT:-100}
  FEATURE_PUMPFUN_RADAR_ENABLED: ${FEATURE_PUMPFUN_RADAR_ENABLED:-false}
  PUMPFUN_PROGRAM_ID: ${PUMPFUN_PROGRAM_ID:-6EF8rrecthR5Dkzon8Nwu78hRvfCKubJ14M5uBEwF6P}
  PUMPFUN_RADAR_MIN_AGE_DAYS: ${PUMPFUN_RADAR_MIN_AGE_DAYS:-6}
  PUMPFUN_RADAR_MAX_AGE_DAYS: ${PUMPFUN_RADAR_MAX_AGE_DAYS:-8}
  PUMPFUN_RADAR_MIN_MARKET_CAP: ${PUMPFUN_RADAR_MIN_MARKET_CAP:-0}
  PUMPFUN_RADAR_MIN_LIQUIDITY: ${PUMPFUN_RADAR_MIN_LIQUIDITY:-0}
  PUMPFUN_RADAR_BATCH_LIMIT: ${PUMPFUN_RADAR_BATCH_LIMIT:-500}
  # How many slices the eligible universe is divided into for the rotation.
  # In the anchor, not on the enrichment service: the beat worker schedules the
  # sweep and the API reports the cycle, so both must agree on the value.
  RADAR_ROTATION_BUCKETS: ${RADAR_ROTATION_BUCKETS:-48}
  SCORING_MODEL_VERSION: ${SCORING_MODEL_VERSION:-v1}
  # The Opportunity Engine. In the anchor, not on the enrichment service: the
  # engine runs there but the API reads the same tables and the same venue
  # config, so a value set on one service only would let the two disagree about
  # what counts as a graduation.
  # Priority enrichment lane. In the anchor because the scheduler beat marks
  # the lane and the enrichment worker reads it — a cadence set on one service
  # only would let them disagree about what "displayed" means.
  FEATURE_PRIORITY_ENRICHMENT_ENABLED: ${FEATURE_PRIORITY_ENRICHMENT_ENABLED:-true}
  ENRICHMENT_PRIORITY_INTERVAL_SECONDS: ${ENRICHMENT_PRIORITY_INTERVAL_SECONDS:-15}
  ENRICHMENT_PRIORITY_RADAR_RANKS: ${ENRICHMENT_PRIORITY_RADAR_RANKS:-25}
  ENRICHMENT_PRIORITY_MAX_TOKENS: ${ENRICHMENT_PRIORITY_MAX_TOKENS:-200}
  # Paper wallet. In the anchor because two services read it: the scheduler
  # runs the review beat and the API serves the wallet, and a starting balance
  # set on one service only would let them disagree about what every return is
  # measured against. Nothing here connects a wallet or touches a chain.
  FEATURE_PAPER_WALLET_ENABLED: ${FEATURE_PAPER_WALLET_ENABLED:-false}
  PAPER_WALLET_STARTING_BALANCE: ${PAPER_WALLET_STARTING_BALANCE:-1000}
  # The default must stay the ungated strategy. A generation cutover is a
  # deliberate act, not something a deployment performs by pulling latest:
  # production does not pin this value, so changing the default here would
  # archive its live wallet and open a new generation on the next deploy.
  # Cutover is opted into per-environment via .env.
  PAPER_WALLET_STRATEGY_ID: ${PAPER_WALLET_STRATEGY_ID:-trailing_stop_25_v1}
  PAPER_WALLET_REVIEW_BATCH_LIMIT: ${PAPER_WALLET_REVIEW_BATCH_LIMIT:-200}
  PAPER_WALLET_CANDIDATE_LIMIT: ${PAPER_WALLET_CANDIDATE_LIMIT:-250}
  PAPER_WALLET_MANAGE_ARCHIVED_GENERATIONS: ${PAPER_WALLET_MANAGE_ARCHIVED_GENERATIONS:-false}
  PAPER_EXECUTION_MODEL: ${PAPER_EXECUTION_MODEL:-jupiter}
  JUPITER_QUOTE_BASE_URL: ${JUPITER_QUOTE_BASE_URL:-https://lite-api.jup.ag/swap/v1}
  JUPITER_QUOTE_TIMEOUT_SECONDS: ${JUPITER_QUOTE_TIMEOUT_SECONDS:-6}
  JUPITER_QUOTE_SLIPPAGE_BPS: ${JUPITER_QUOTE_SLIPPAGE_BPS:-50}
  JUPITER_USDC_MINT: ${JUPITER_USDC_MINT:-EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v}
  # The Karthik paper wallet. In the anchor, not on the worker: the Celery
  # worker makes the decisions and the API reports them, so a pause set on one
  # of them would show a paused wallet that was still buying — the exact shape
  # of the three failures this anchor's comment above records.
  KARTHIK_ENTRIES_PAUSED: ${KARTHIK_ENTRIES_PAUSED:-false}
  # V4 containment: entry-only pause for the Original Paper Wallet, and the
  # one reason string every surface prints for both pauses.
  PAPER_WALLET_ENTRIES_PAUSED: ${PAPER_WALLET_ENTRIES_PAUSED:-false}
  WALLET_ENTRIES_PAUSE_REASON: ${WALLET_ENTRIES_PAUSE_REASON:-}
  # V4 Phase 2 data foundation: the enrichment workers write what the API and
  # research read, so the writers and readers must agree on every one of these.
  FEATURE_SNAPSHOT_SANITY_ENABLED: ${FEATURE_SNAPSHOT_SANITY_ENABLED:-true}
  RADAR_MIN_OBSERVATION_MINUTES: ${RADAR_MIN_OBSERVATION_MINUTES:-0}
  FEATURE_WALLET_FLOW_ENABLED: ${FEATURE_WALLET_FLOW_ENABLED:-false}
  FEATURE_RESEARCH_COLLECTORS_ENABLED: ${FEATURE_RESEARCH_COLLECTORS_ENABLED:-false}
  # V5 Forward Arena: worker scores it, API reads it — both must agree.
  FEATURE_ARENA_ENABLED: ${FEATURE_ARENA_ENABLED:-false}
  ARENA_VALID_FROM: ${ARENA_VALID_FROM:-}
  # Socket only. MAINNET_SIGNER_FILE is deliberately absent from this anchor:
  # the signer service reads it from its own environment, and no application
  # container may name a key path.
  MAINNET_SIGNER_SOCKET: ${MAINNET_SIGNER_SOCKET:-}
  FEATURE_LAB_ENABLED: ${FEATURE_LAB_ENABLED:-false}
  # In the anchor, not only in .env.production. This list is EXPLICIT, so a new
  # variable set in the env file and absent here never reaches the container —
  # the deploy appears to succeed and the flag does nothing. That has happened
  # here before (fixed in 55feaa3) and it costs an hour every time.
  FEATURE_COMPOUND_LAB_ENABLED: ${FEATURE_COMPOUND_LAB_ENABLED:-false}
  FEATURE_PUMPFUN_LAB_ENABLED: ${FEATURE_PUMPFUN_LAB_ENABLED:-false}
  LAB_VALID_FROM: ${LAB_VALID_FROM:-}
  KARTHIK_CANDIDATE_LIMIT: ${KARTHIK_CANDIDATE_LIMIT:-250}
  KARTHIK_REVIEW_BATCH_LIMIT: ${KARTHIK_REVIEW_BATCH_LIMIT:-2000}
  KARTHIK_MAX_MARKET_AGE_SECONDS: ${KARTHIK_MAX_MARKET_AGE_SECONDS:-900}
  # HQ's autonomous repair switch. Read straight from the environment by
  # `app.hq_ops.remediation.autonomy_enabled`, not through settings, so it has
  # to be passed explicitly here or HQ silently stays in detect-only mode —
  # which is exactly what it was doing while the disk climbed to 95%.
  #
  # Default OFF is deliberate and stays that way: this is the one switch that
  # lets a scheduled job change the running system.
  HQ_AUTONOMY_ENABLED: ${HQ_AUTONOMY_ENABLED:-false}

  # --- Real-wallet execution contract --------------------------------------
  # EVERY setting below is in the shared anchor on purpose, and this is the one
  # block where a per-service override would be a safety incident rather than a
  # bug. The API serves the readiness dashboard, the Celery worker is where an
  # execution would actually run, and the beat scheduler decides when it runs.
  # If those three disagree about the mode, a limit, or a safety threshold, the
  # dashboard can report "disabled" while the worker executes — which is the
  # exact drift `test_compose_env_contract.py` records as having happened three
  # times already on less dangerous settings.
  #
  # The three controls stay disabled here. Enabling execution is a deliberate,
  # separately reviewed act, not a side effect of editing this file.
  REAL_WALLET_EXECUTION_MODE: ${REAL_WALLET_EXECUTION_MODE:-disabled}
  REAL_WALLET_EXECUTION_ENABLED: ${REAL_WALLET_EXECUTION_ENABLED:-false}
  REAL_WALLET_AUTOTRADE_ENABLED: ${REAL_WALLET_AUTOTRADE_ENABLED:-false}
  REAL_WALLET_NETWORK: ${REAL_WALLET_NETWORK:-devnet}
  REAL_WALLET_RPC_URL: ${REAL_WALLET_RPC_URL:-https://api.devnet.solana.com}
  # The endpoint allowlist. A genesis check proves which chain a host *claims*;
  # this proves we agreed to ask that host. Startup refuses a wallet RPC URL
  # outside it, so a divergent value here fails loudly instead of quietly.
  REAL_WALLET_ALLOWED_RPC_HOSTS: ${REAL_WALLET_ALLOWED_RPC_HOSTS:-api.devnet.solana.com}
  # Extra top-level programs a real swap may invoke, beyond the reviewed
  # defaults in real_wallet/tx_inspect.py. Divergence here would let one
  # service sign a program another would refuse.
  REAL_WALLET_ALLOWED_PROGRAM_IDS: ${REAL_WALLET_ALLOWED_PROGRAM_IDS:-}
  # Public address only. Phase 1 rejects a signer path in every application
  # container; a later isolated signer service will own its own secret mount.
  REAL_WALLET_PUBLIC_KEY: ${REAL_WALLET_PUBLIC_KEY:-}
  # The one address funds may leave for. Absent here it never reaches the
  # container and the policy refuses everything — fail-closed, but silently the
  # wrong reason. This anchor has swallowed a variable five times before.
  REAL_WALLET_WITHDRAWAL_ADDRESS: ${REAL_WALLET_WITHDRAWAL_ADDRESS:-}
  REAL_WALLET_EXECUTION_SECRET_FILE: ${REAL_WALLET_EXECUTION_SECRET_FILE:-}
  # API/workers receive a socket path only. The actual signer-file path is
  # deliberately absent from this shared environment and mounted only into the
  # opt-in `devnet-signer` profile below.
  PHASE2_DEVNET_SIGNER_SOCKET: ${PHASE2_DEVNET_SIGNER_SOCKET:-}
  PHASE2_DEVNET_QUOTE_TTL_SECONDS: ${PHASE2_DEVNET_QUOTE_TTL_SECONDS:-60}
  PHASE2_DEVNET_APPROVAL_TTL_SECONDS: ${PHASE2_DEVNET_APPROVAL_TTL_SECONDS:-120}
  PHASE2_DEVNET_MAX_TRANSFER_LAMPORTS: ${PHASE2_DEVNET_MAX_TRANSFER_LAMPORTS:-1000000}
  PHASE2_DEVNET_CONFIRM_RETRIES: ${PHASE2_DEVNET_CONFIRM_RETRIES:-6}
  PHASE2_DEVNET_CONFIRM_RETRY_SECONDS: ${PHASE2_DEVNET_CONFIRM_RETRY_SECONDS:-1}
  # Canary exposure limits. A worker with a larger limit than the API reports is
  # how a "$5 canary" silently becomes something else.
  #
  # Entry size is deliberately 0 — unconfigured, and unconfigured refuses. The
  # final $100/$50/$25 ladder is the Paper position-size evidence work's
  # decision; defaulting it here would pre-empt that decision in a compose file.
  REAL_WALLET_ENTRY_SIZE_USD: ${REAL_WALLET_ENTRY_SIZE_USD:-0}
  REAL_WALLET_MAX_TRADE_USD: ${REAL_WALLET_MAX_TRADE_USD:-5}
  REAL_WALLET_MAX_OPEN_POSITIONS: ${REAL_WALLET_MAX_OPEN_POSITIONS:-1}
  REAL_WALLET_MAX_TOTAL_EXPOSURE_USD: ${REAL_WALLET_MAX_TOTAL_EXPOSURE_USD:-10}
  REAL_WALLET_MAX_DAILY_NOTIONAL_USD: ${REAL_WALLET_MAX_DAILY_NOTIONAL_USD:-20}
  REAL_WALLET_MAX_DAILY_TRADES: ${REAL_WALLET_MAX_DAILY_TRADES:-4}
  REAL_WALLET_MAX_DAILY_LOSS_USD: ${REAL_WALLET_MAX_DAILY_LOSS_USD:-10}
  # The ceiling that makes the blast radius a number rather than a promise.
  # Compared in integer lamports; over-funding is refused, not traded.
  REAL_WALLET_MAX_BALANCE_SOL: ${REAL_WALLET_MAX_BALANCE_SOL:-0.25}
  # Whether that ceiling applies at all. Defaults TRUE so a compose file that
  # has not heard of it keeps the bound — the safe direction, and the reason
  # this is a named flag rather than a sentinel value on the number above.
  REAL_WALLET_BALANCE_CEILING_ENABLED: ${REAL_WALLET_BALANCE_CEILING_ENABLED:-true}
  # Account size at which the stake and every DOLLAR cap double. Zero leaves
  # the ladder inert, matching ENTRY_SIZE_USD above: nobody has said at what
  # balance a real order should grow, and a default here would invent it.
  REAL_WALLET_SIZING_BASE_USD: ${REAL_WALLET_SIZING_BASE_USD:-0}
  # Real exit quote bounds. A fired trigger with no priceable route becomes an
  # explicit failure state; divergence would let one service call it executable.
  REAL_WALLET_EXIT_MAX_QUOTE_AGE_SECONDS: ${REAL_WALLET_EXIT_MAX_QUOTE_AGE_SECONDS:-15}
  REAL_WALLET_EXIT_MAX_PRICE_IMPACT_PCT: ${REAL_WALLET_EXIT_MAX_PRICE_IMPACT_PCT:-5}
  REAL_WALLET_EXIT_MAX_SLIPPAGE_BPS: ${REAL_WALLET_EXIT_MAX_SLIPPAGE_BPS:-300}
  REAL_WALLET_MIN_SOL_FEE_RESERVE: ${REAL_WALLET_MIN_SOL_FEE_RESERVE:-0.01}
  REAL_WALLET_AUTOTRADE_COOLDOWN_SECONDS: ${REAL_WALLET_AUTOTRADE_COOLDOWN_SECONDS:-300}
  # Kill-switch accounting. The worker records failures and the API reports the
  # switch; a divergent threshold means one of them is wrong about the state.
  REAL_WALLET_MAX_CONSECUTIVE_EXECUTION_FAILURES: ${REAL_WALLET_MAX_CONSECUTIVE_EXECUTION_FAILURES:-2}
  REAL_WALLET_DRY_RUN_CANDIDATE_LIMIT: ${REAL_WALLET_DRY_RUN_CANDIDATE_LIMIT:-10}
  FEATURE_REAL_WALLET_DRY_RUN_ENABLED: ${FEATURE_REAL_WALLET_DRY_RUN_ENABLED:-false}
  # Safety-gate thresholds. The gate runs wherever an intent is evaluated, so a
  # looser threshold on one service admits trades another would have refused.
  REAL_WALLET_SAFETY_POLICY_VERSION: ${REAL_WALLET_SAFETY_POLICY_VERSION:-real_wallet_safety_v1}
  REAL_WALLET_SAFETY_MAX_MARKET_AGE_SECONDS: ${REAL_WALLET_SAFETY_MAX_MARKET_AGE_SECONDS:-90}
  REAL_WALLET_SAFETY_MAX_QUOTE_AGE_SECONDS: ${REAL_WALLET_SAFETY_MAX_QUOTE_AGE_SECONDS:-15}
  REAL_WALLET_SAFETY_MAX_BUY_PRICE_IMPACT_PCT: ${REAL_WALLET_SAFETY_MAX_BUY_PRICE_IMPACT_PCT:-5}
  REAL_WALLET_SAFETY_MAX_SELL_PRICE_IMPACT_PCT: ${REAL_WALLET_SAFETY_MAX_SELL_PRICE_IMPACT_PCT:-5}
  REAL_WALLET_SAFETY_MAX_ROUND_TRIP_LOSS_PCT: ${REAL_WALLET_SAFETY_MAX_ROUND_TRIP_LOSS_PCT:-10}
  REAL_WALLET_SAFETY_MAX_POSITION_LIQUIDITY_RATIO: ${REAL_WALLET_SAFETY_MAX_POSITION_LIQUIDITY_RATIO:-0.01}
  REAL_WALLET_SAFETY_MAX_PRICE_DEVIATION_PCT: ${REAL_WALLET_SAFETY_MAX_PRICE_DEVIATION_PCT:-5}
  REAL_WALLET_SAFETY_SUPPORTED_VENUES: ${REAL_WALLET_SAFETY_SUPPORTED_VENUES:-pumpfun,pumpswap}
  REAL_WALLET_SAFETY_SUPPORTED_TOKEN_2022_EXTENSIONS: ${REAL_WALLET_SAFETY_SUPPORTED_TOKEN_2022_EXTENSIONS:-18,19}
  # The real-execution Jupiter endpoint, kept apart from the paper quote API.
  # A divergent base URL across services would mean one of them talks to an
  # endpoint nobody reviewed.
  JUPITER_V2_BASE_URL: ${JUPITER_V2_BASE_URL:-https://api.jup.ag/swap/v2}
  JUPITER_V2_ORDER_TIMEOUT_SECONDS: ${JUPITER_V2_ORDER_TIMEOUT_SECONDS:-8}
  # SOL/USD for fee accounting and the fee reserve. Without one shared source
  # and freshness bound, two services would disagree about whether the wallet
  # can afford its own exit transaction.
  EXECUTION_SOL_PRICE_PROVIDER: ${EXECUTION_SOL_PRICE_PROVIDER:-jupiter}
  EXECUTION_SOL_PRICE_MAX_AGE_SECONDS: ${EXECUTION_SOL_PRICE_MAX_AGE_SECONDS:-120}
  EXECUTION_SOL_MINT: ${EXECUTION_SOL_MINT:-So11111111111111111111111111111111111111112}
  EXECUTION_PRIORITY_FEE_SOL: ${EXECUTION_PRIORITY_FEE_SOL:-0.0005}
  EXECUTION_EXIT_FEE_RESERVE_MULTIPLIER: ${EXECUTION_EXIT_FEE_RESERVE_MULTIPLIER:-2}

  # Breakout TTLs. In the anchor because two services read them: the enrichment
  # worker sets a signal's expiry at detection and the beat scheduler decides
  # what has lapsed. Split across services, one would open signals the other
  # closes early — or never.
  # The published boundaries of the breakout claim. Measured, not chosen — see
  # app/opportunities/providers/breakout.py.
  # Near graduation. Off because the data does not support it, not because the
  # provider is unfinished — see app/opportunities/providers/near_graduation.py.
  # In the anchor with the rest: the enrichment worker runs detection and the API
  # reads what it wrote, so both must agree on whether the signal can be emitted.
  # Direct bonding-curve reads. In the anchor with the rest: the enrichment
  # worker collects and the API reads what it wrote, so both must agree on
  # whether curve data exists. Blocked today by the Helius plan quota.
  FEATURE_CURVE_COLLECTION_ENABLED: ${FEATURE_CURVE_COLLECTION_ENABLED:-false}
  # Must stay >= ENRICHMENT_BATCH_LIMIT: the collector chunks for the RPC on
  # its own, so a lower value here silently drops the tail of every full batch.
  CURVE_COLLECTION_BATCH_LIMIT: ${CURVE_COLLECTION_BATCH_LIMIT:-120}
  # Local development only. The app refuses to boot if this is set while
  # ENVIRONMENT=production.
  DEVELOPMENT_BYPASS_AUTH: ${DEVELOPMENT_BYPASS_AUTH:-false}
  SCORING_SWEEP_BATCH_LIMIT: ${SCORING_SWEEP_BATCH_LIMIT:-200}
  # Retention and disk protection. In the anchor, not on one service: the beat
  # scheduler decides when to prune, the Celery worker runs it, and the API
  # reports disk health — a window set on one only would let them disagree
  # about what is being kept. 30 -> 7 after the 2026-08-21 audit found score
  # history at 11 GB, 79% of it older than a week.
  SCORING_HISTORY_RETENTION_DAYS: ${SCORING_HISTORY_RETENTION_DAYS:-7}
  MARKET_SNAPSHOT_RETENTION_DAYS: ${MARKET_SNAPSHOT_RETENTION_DAYS:-7}
  RADAR_DECISION_SNAPSHOT_RETENTION_DAYS: ${RADAR_DECISION_SNAPSHOT_RETENTION_DAYS:-2}
  SCORING_HISTORY_EMERGENCY_DAYS: ${SCORING_HISTORY_EMERGENCY_DAYS:-3}
  RADAR_DECISION_SNAPSHOT_EMERGENCY_DAYS: ${RADAR_DECISION_SNAPSHOT_EMERGENCY_DAYS:-1}
  DISK_WARNING_PERCENT: ${DISK_WARNING_PERCENT:-75}
  DISK_CRITICAL_PERCENT: ${DISK_CRITICAL_PERCENT:-85}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    # Market snapshot reads can use PostgreSQL dynamic shared memory; Docker's
    # 64 MiB default exhausts under the live paper-wallet benchmark query.
    shm_size: 256m
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-memescope}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-memescope}
      POSTGRES_DB: ${POSTGRES_DB:-memescope}
      # Deterministic collation keeps index behaviour identical across machines.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-memescope} -d ${POSTGRES_DB:-memescope}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      target: development
    restart: unless-stopped
    command:
      - /bin/bash
      - ./scripts/entrypoint.sh
      - uvicorn
      - app.main:app
      - --host=0.0.0.0
      - --port=8000
      - --reload
    environment: *backend-env
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    volumes:
      # Bind-mount source for hot reload; keep the image's venv out of the way.
      - ./backend:/app
      # API gets only the signer IPC endpoint, never the signer-file mount.
      - devnet-signer-socket:/run/memescope-devnet-signer
      - mainnet-signer-socket:/run/memescope-mainnet-signer
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/live"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  # Opt-in only. This process is outside FastAPI/web and mounts the signer file
  # while every API/worker service receives only a Unix socket path. It accepts
  # an approved intent ID, reloads it from Postgres, independently verifies
  # devnet and transaction semantics, and signs once. Do not enable this
  # profile without a funded *devnet-only* wallet and a 0600 keypair file.
  devnet-signer:
    profiles: ["devnet-signer"]
    build:
      context: ./backend
      target: development
    restart: on-failure
    command:
      - python
      - -m
      - app.real_wallet.devnet_signer
      - --serve
      - --socket
      - /run/memescope-devnet-signer/signer.sock
    environment:
      <<: *backend-env
      RUN_MIGRATIONS: "false"
      PHASE2_DEVNET_SIGNER_SOCKET: /run/memescope-devnet-signer/signer.sock
      PHASE2_DEVNET_SIGNER_FILE: /run/secrets/phase2-devnet-signer.json
    volumes:
      - ./backend:/app
      - devnet-signer-socket:/run/memescope-devnet-signer
      # The profile remains inert until selected; when selected, this default
      # deliberately points nowhere useful so the signer fails closed rather
      # than accepting an accidental key location.
      - ${PHASE2_DEVNET_SIGNER_FILE_HOST:-/run/memescope-devnet-signer-missing}:/run/secrets/phase2-devnet-signer.json:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Opt-in only, and the only process that mounts the MAINNET key. Every API and
  # worker container receives the socket and nothing else — `MAINNET_SIGNER_FILE`
  # is absent from the backend env anchor on purpose, so no application
  # container can name a key path even by accident.
  #
  # It answers exactly one question, `identity`, and refuses to sign: there is no
  # mainnet intent model to sign, and a signer built for intents that do not yet
  # exist is a speculative attack surface on the component whose compromise
  # loses the wallet. It also refuses to start off mainnet, or against an RPC
  # host that is not on the allowlist.
  mainnet-signer:
    profiles: ["mainnet-signer"]
    build:
      context: ./backend
      target: development
    restart: on-failure
    command:
      - python
      - -m
      - app.real_wallet.mainnet_signer
      - --serve
      - --socket
      - /run/memescope-mainnet-signer/signer.sock
    environment:
      <<: *backend-env
      RUN_MIGRATIONS: "false"
      MAINNET_SIGNER_SOCKET: /run/memescope-mainnet-signer/signer.sock
      MAINNET_SIGNER_FILE: /run/secrets/mainnet-signer.json
    volumes:
      - ./backend:/app
      - mainnet-signer-socket:/run/memescope-mainnet-signer
      # Inert until the profile is selected; the default deliberately points
      # nowhere useful so the signer fails closed rather than picking up an
      # accidental key location.
      - ${MAINNET_SIGNER_FILE_HOST:-/run/memescope-mainnet-signer-missing}:/run/secrets/mainnet-signer.json:ro
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build:
      context: ./backend
      target: development
    restart: unless-stopped
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=2
    environment:
      <<: *backend-env
      RUN_MIGRATIONS: "false"
    volumes:
      - ./backend:/app
      - mainnet-signer-socket:/run/memescope-mainnet-signer
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      # The image's HEALTHCHECK curls the API's /live, which does not exist in
      # this container — so it always failed and the status meant nothing while
      # a wedged worker consumed nothing for fifty minutes on 2026-08-21.
      test: ["CMD", "python", "-m", "app.health.worker_probe", "worker"]
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 60s

  scheduler:
    build:
      context: ./backend
      target: development
    restart: unless-stopped
    # --schedule outside /app: the source tree is bind-mounted here, so the
    # default CWD shelve persisted a beat entry that had been deleted from
    # celery_app.py and kept firing it for 18h at a worker that never
    # registered it. /tmp is ephemeral, which is the point.
    command: >
      celery -A app.workers.celery_app beat --loglevel=info
      --schedule=/tmp/celerybeat-schedule
    environment:
      <<: *backend-env
      RUN_MIGRATIONS: "false"
    volumes:
      - ./backend:/app
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      # Beat only sends, so it cannot answer a ping. Its shelve is the signal:
      # it is rewritten on every tick, so a file that stops advancing is a
      # scheduler that has stopped scheduling.
      test: ["CMD", "python", "-m", "app.health.worker_probe", "beat"]
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 90s

  # Long-lived Helius WebSocket consumer. Deliberately a single replica: each
  # instance opens its own subscription, so scaling out would duplicate every
  # event rather than share the load.
  scanner:
    build:
      context: ./backend
      target: development
    restart: unless-stopped
    command: python -m app.scanner_main
    environment:
      <<: *backend-env
      RUN_MIGRATIONS: "false"
    volumes:
      - ./backend:/app
    depends_on:
      backend:
        condition: service_healthy
    # The scanner spent four days connected to nothing while this service
    # reported `Up`, because a live process was the only thing anyone checked.
    # This probe checks the *outcome* instead: has a token been discovered
    # recently, and does the scanner itself believe it can reach Helius.
    #
    # `start_period` is generous on purpose — a cold start has to connect,
    # subscribe and wait for an actual launch before it can pass, and failing
    # during that window would restart-loop a scanner that is working fine.
    healthcheck:
      test: ["CMD", "python", "-m", "app.health.probe"]
      interval: 120s
      timeout: 20s
      retries: 3
      start_period: 300s

  # Isolated Yellowstone gRPC observer. Phase 1 never writes discovered_tokens
  # and cannot block or replace the primary RPC scanner.
  yellowstone:
    profiles: ["yellowstone"]
    build:
      context: ./backend
      target: development
    restart: on-failure
    command: python -m app.yellowstone_main
    environment:
      <<: *backend-env
      RUN_MIGRATIONS: "false"
    volumes:
      - ./backend:/app
    depends_on:
      backend:
        condition: service_healthy

  # Market Enrichment Worker. Independent of the scanner: stopping this service
  # must never affect token discovery.
  enrichment:
    build:
      context: ./backend
      target: development
    restart: unless-stopped
    command: python -m app.enrichment_main
    environment:
      <<: *backend-env
      RUN_MIGRATIONS: "false"
    volumes:
      - ./backend:/app
    healthcheck:
      disable: true

  # V4 Phase 2: snapshot-only replica for the nursery/display cadence SLA.
  # Same image, one env flag — it claims only the priority lanes and skips
  # the scoring/radar/curves tail that throttled collection to ~30 tokens/min.
  enrichment-fast:
    build:
      context: ./backend
      target: development
    restart: unless-stopped
    command: python -m app.enrichment_main
    environment:
      <<: *backend-env
      RUN_MIGRATIONS: "false"
      ENRICHMENT_FAST_LANE_ONLY: "true"
    volumes:
      - ./backend:/app
    healthcheck:
      disable: true
    depends_on:
      backend:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      target: development
    restart: unless-stopped
    environment:
      # Empty intentionally means browser same-origin `/api/v1`; unlike `:-`,
      # the `-` form preserves an explicitly blank local setting instead of
      # injecting localhost into a remote browser bundle.
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL-}
      NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-MemeScope AI}
      NEXT_PUBLIC_ENVIRONMENT: ${NEXT_PUBLIC_ENVIRONMENT:-local}
      # Local development only; ignored in a production build.
      NEXT_PUBLIC_DEVELOPMENT_BYPASS_AUTH: ${NEXT_PUBLIC_DEVELOPMENT_BYPASS_AUTH:-false}
      WATCHPACK_POLLING: "true"
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ./frontend:/app
      # Anonymous volumes so container-built artifacts are not shadowed by the host.
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend

volumes:
  postgres-data:
  redis-data:
  devnet-signer-socket:
  mainnet-signer-socket:
